<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel</title>
<link rel="stylesheet" href="css/painel.css">
</head>
<body>

<!-- Esqueleto. Nenhuma frase mora aqui: cada lugar de texto é um ponto vazio
     com a CHAVE da frase em `data-texto`, e quem preenche é o banco. -->

<div class="folha entrar" id="tela-login">
  <h1 id="login-titulo"></h1>
  <p class="sub" id="login-apoio"></p>
  <!-- Formulário de verdade, com name e submit: é isso que faz o navegador
       oferecer guardar a senha e preencher sozinho da próxima vez. -->
  <form id="form-login" autocomplete="on">
    <label><span id="rot-email"></span>
      <input id="email" name="username" type="email" autocomplete="username"></label>
    <label><span id="rot-senha"></span>
      <span class="campo-senha">
        <input id="senha" name="password" type="password" autocomplete="current-password">
        <button type="button" class="olho" id="ver-senha" aria-pressed="false"></button>
      </span>
    </label>
    <button class="principal" id="btentrar" type="submit"></button>
  </form>
  <div class="erro" id="erro-login"></div>
</div>

<div class="folha larga oculto" id="tela-painel">
  <header class="barra">
    <div class="cresce">
      <h1 id="titulo"></h1>
      <p class="sub" id="resumo"></p>
    </div>
    <div class="abas" id="abas"></div>
    <div class="periodos" id="periodos"></div>
    <button class="alterna" id="bt-internos" aria-pressed="false"></button>
    <button class="sair" id="btsair"></button>
  </header>

  <!-- ── aba: caminho ────────────────────────────────────────────── -->
  <div data-vista="caminho">
    <div class="faixa">
      <div class="resumo" id="numeros"></div>
      <div id="veredito"></div>
    </div>

    <div class="grade">
      <div class="caminho-lado">
        <section class="secao">
          <h2 data-texto="sec_caminho"></h2>
          <p class="porque" data-texto="sec_caminho_porque"></p>
          <div id="fluxo"></div>
        </section>
      </div>

      <div class="cortes">
        <section class="secao">
          <h2 data-texto="sec_criativos"></h2>
          <p class="porque" data-texto="sec_criativos_porque"></p>
          <div id="criativos"></div>
        </section>
        <section class="secao">
          <h2 data-texto="sec_aparelhos"></h2>
          <p class="porque" data-texto="sec_aparelhos_porque"></p>
          <div id="aparelhos"></div>
        </section>
        <section class="secao">
          <h2 data-texto="sec_dias"></h2>
          <p class="porque" data-texto="sec_dias_porque"></p>
          <div id="dias"></div>
        </section>
        <section class="secao">
          <h2 data-texto="sec_tecnico"></h2>
          <p class="porque" data-texto="sec_tecnico_porque"></p>
          <div class="cartoes" id="tecnico"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- ── aba: mapa ───────────────────────────────────────────────── -->
  <div data-vista="mapa" class="oculto">
    <section class="secao secao-agora">
      <h2 data-texto="sec_agora"></h2>
      <div id="agora"></div>
    </section>
    <section class="secao">
      <h2 data-texto="sec_mapa"></h2>
      <p class="porque" data-texto="sec_mapa_porque"></p>
      <div id="mapa"></div>
    </section>
  </div>
</div>

<script src="../config.js"></script>
<script type="module" src="js/painel.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Teste de insônia</title>
<style>
:root{
  --noite:#11151d; --noite-2:#1a2130; --noite-3:#252e40;
  --luz:#f4f1ea; --luz-2:#cdd3de; --luz-3:#8d97a8;
  --linha:#2d3648;
  --lua:#e2a04a;
  --calmo:#57c193;
  --perda:#e2685a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--noite); color:var(--luz);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px; line-height:1.5;
  padding:16px; padding-bottom:48px;
}
.folha{max-width:980px; margin:0 auto}
h1{font-size:19px; margin:0 0 2px; font-weight:600}
h2{font-size:15px; margin:28px 0 10px; font-weight:600; color:var(--luz)}
.sub{color:var(--luz-3); font-size:13px; margin:0 0 18px}

/* ── login ───────────────────────────────────────────────────────── */
.entrar{max-width:320px; margin:12vh auto 0}
label{display:block; margin:0 0 12px}
label span{display:block; font-size:13px; color:var(--luz-2); margin-bottom:5px}
input, select{
  width:100%; padding:11px 12px; font-size:16px; font-family:inherit;
  background:var(--noite-2); color:var(--luz);
  border:1px solid var(--linha); border-radius:9px;
}
input:focus, select:focus{outline:2px solid var(--lua); outline-offset:1px}
button.principal{
  width:100%; padding:12px; font-size:15px; font-weight:600; font-family:inherit;
  background:var(--lua); color:#11151d; border:0; border-radius:9px; cursor:pointer;
}
button.principal:disabled{opacity:.5; cursor:default}
.erro{color:var(--perda); font-size:13px; margin-top:10px; min-height:18px}

/* ── barra de período ────────────────────────────────────────────── */
.topo{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.topo .cresce{flex:1}
.periodos{display:flex; gap:6px; flex-wrap:wrap}
.periodos button{
  padding:7px 12px; font-size:13px; font-family:inherit; cursor:pointer;
  background:var(--noite-2); color:var(--luz-2);
  border:1px solid var(--linha); border-radius:8px;
}
.periodos button[aria-pressed="true"]{background:var(--noite-3); color:var(--luz); border-color:var(--lua)}
.sair{background:none; border:0; color:var(--luz-3); font-size:13px; cursor:pointer; font-family:inherit; padding:7px 0}

/* ── funil ───────────────────────────────────────────────────────── */
.passo{margin:0 0 9px}
.passo .rot{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13px; margin-bottom:4px}
.passo .rot b{font-weight:600; font-size:14px}
.passo .rot .pct{color:var(--luz-3); font-variant-numeric:tabular-nums}
.trilho{height:22px; background:var(--noite-2); border-radius:6px; overflow:hidden; position:relative}
.cheio{height:100%; background:var(--noite-3); border-right:2px solid var(--lua); transition:width .4s ease}
.queda{font-size:12px; color:var(--luz-3); margin:2px 0 0; padding-left:1px}
.queda.forte{color:var(--perda); font-weight:600}

/* ── tabelas ─────────────────────────────────────────────────────── */
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--linha)}
th{color:var(--luz-3); font-weight:500; font-size:12.5px}
td.n, th.n{text-align:right; font-variant-numeric:tabular-nums}
.vazio{color:var(--luz-3); font-size:13.5px; padding:10px 0}

/* ── cartões ─────────────────────────────────────────────────────── */
.cartoes{display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px}
.cartao{background:var(--noite-2); border:1px solid var(--linha); border-radius:10px; padding:12px}
.cartao .v{font-size:21px; font-weight:600; font-variant-numeric:tabular-nums}
.cartao .k{font-size:12.5px; color:var(--luz-3); margin-top:2px}
.cartao.alerta .v{color:var(--perda)}
.nota{font-size:12.5px; color:var(--luz-3); margin:10px 0 0}
.oculto{display:none}
</style>
</head>
<body>

<!-- ── login ─────────────────────────────────────────────────────── -->
<div class="folha entrar" id="tela-login">
  <h1>Painel do teste de insônia</h1>
  <p class="sub">Entre para ver o funil.</p>
  <label><span>E-mail</span><input id="email" type="email" autocomplete="username"></label>
  <label><span>Senha</span><input id="senha" type="password" autocomplete="current-password"></label>
  <button class="principal" id="btentrar">Entrar</button>
  <div class="erro" id="erro-login"></div>
</div>

<!-- ── painel ────────────────────────────────────────────────────── -->
<div class="folha oculto" id="tela-painel">
  <div class="topo">
    <div class="cresce">
      <h1>Funil do teste</h1>
      <p class="sub" id="resumo">a carregar…</p>
    </div>
    <button class="sair" id="btsair">sair</button>
  </div>
  <div class="periodos" id="periodos">
    <button data-dias="7">7 dias</button>
    <button data-dias="30" aria-pressed="true">30 dias</button>
    <button data-dias="0">tudo</button>
  </div>

  <h2>Onde cada visita para</h2>
  <div id="funil"></div>
  <p class="nota" id="nota-funil"></p>

  <h2>Tela em que fechou a página</h2>
  <div id="saidas"></div>

  <h2>Por anúncio</h2>
  <div id="criativos"></div>

  <h2>Por aparelho e navegador</h2>
  <div id="aparelhos"></div>

  <h2>Saúde técnica</h2>
  <div class="cartoes" id="tecnico"></div>

  <h2>Por dia</h2>
  <div id="dias"></div>
</div>

<script src="../config.js"></script>
<script>
(function(){
  'use strict';
  var CFG = window.QUIZ_CONFIG;
  var SESSAO = 'painel_sessao';

  function $(id){ return document.getElementById(id); }
  function esc(x){
    return String(x == null ? '' : x)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function num(n){ return (n == null ? '—' : Number(n).toLocaleString('pt-BR')); }

  // ── sessão ────────────────────────────────────────────────────────
  function guardada(){
    try { return JSON.parse(localStorage.getItem(SESSAO) || 'null'); } catch (e) { return null; }
  }
  function guardar(s){
    try { localStorage.setItem(SESSAO, JSON.stringify(s)); } catch (e) {}
  }
  function esquecer(){
    try { localStorage.removeItem(SESSAO); } catch (e) {}
  }

  function entrar(email, senha){
    return fetch(CFG.url + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': CFG.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: senha })
    }).then(function(r){ return r.json(); });
  }

  // O token dura uma hora. Em vez de obrigar a entrar de novo, troca o de
  // atualização por um novo e segue; só cai para o login se ele também morreu.
  function renovar(){
    var s = guardada();
    if (!s || !s.refresh_token) return Promise.resolve(null);
    return fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': CFG.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.access_token) { guardar(d); return d; }
        return null;
      }).catch(function(){ return null; });
  }

  // ── dados ─────────────────────────────────────────────────────────
  function chamar(desde, segunda){
    var s = guardada();
    if (!s || !s.access_token) return Promise.reject('sem_sessao');
    return fetch(CFG.url + '/rest/v1/rpc/painel_funil', {
      method: 'POST',
      headers: {
        'apikey': CFG.anon,
        'Authorization': 'Bearer ' + s.access_token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_desde: desde, p_ate: null })
    }).then(function(r){
      if (r.status === 401 && !segunda) {
        return renovar().then(function(novo){
          if (!novo) throw 'sem_sessao';
          return chamar(desde, true);
        });
      }
      if (!r.ok) throw 'falhou';
      return r.json();
    });
  }

  // ── desenho ───────────────────────────────────────────────────────
  var ROTULOS = {
    abriu:    'Abriu a página',
    comecou:  'Tocou em começar',
    sexo:     'Respondeu se é homem ou mulher',
    nome:     'Disse o nome',
    contato:  'Chegou na tela do WhatsApp',
    lead:     'Mandou o número (lead)'
  };
  function rotulo(chave){
    if (ROTULOS[chave]) return ROTULOS[chave];
    var m = /^pergunta_(\d+)$/.exec(chave);
    return m ? 'Pergunta ' + m[1] : chave;
  }

  function desenharFunil(funil){
    var alvo = $('funil');
    if (!funil.length) { alvo.innerHTML = '<p class="vazio">Nenhuma visita neste período.</p>'; return; }
    var topo = funil[0].n || 0;

    // A maior queda é o que interessa olhar primeiro, então ela fica marcada.
    var maior = 0;
    funil.forEach(function(p, i){
      if (i === 0) return;
      var perdeu = (funil[i-1].n || 0) - (p.n || 0);
      if (perdeu > maior) maior = perdeu;
    });

    alvo.innerHTML = funil.map(function(p, i){
      var n = p.n || 0;
      var pct = topo ? Math.round(n / topo * 100) : 0;
      var antes = i ? (funil[i-1].n || 0) : null;
      var perdeu = antes === null ? null : antes - n;
      var pctQueda = (antes ? Math.round(perdeu / antes * 100) : 0);
      // Passo que CRESCE em relação ao anterior não é queda: é sinal de que o
      // teste mudou de tamanho e as visitas antigas não tinham essa pergunta.
      var linha = '';
      if (perdeu !== null && perdeu > 0) {
        linha = '<p class="queda' + (perdeu === maior && perdeu > 0 ? ' forte' : '') + '">↳ saíram ' +
                num(perdeu) + ' aqui (' + pctQueda + '% de quem tinha chegado)</p>';
      } else if (perdeu !== null && perdeu < 0) {
        linha = '<p class="queda">↳ passo criado depois: visitas antigas não tinham esta pergunta</p>';
      }
      return '<div class="passo">' +
        '<div class="rot"><b>' + esc(rotulo(p.chave)) + '</b>' +
        '<span class="pct">' + num(n) + ' · ' + pct + '%</span></div>' +
        '<div class="trilho"><div class="cheio" style="width:' + Math.max(pct, 1) + '%"></div></div>' +
        linha + '</div>';
    }).join('');
  }

  function tabela(alvo, linhas, colunas, vazio){
    var el = $(alvo);
    if (!linhas || !linhas.length) { el.innerHTML = '<p class="vazio">' + vazio + '</p>'; return; }
    el.innerHTML = '<table><thead><tr>' +
      colunas.map(function(c){ return '<th class="' + (c.n ? 'n' : '') + '">' + esc(c.titulo) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      linhas.map(function(l){
        return '<tr>' + colunas.map(function(c){
          return '<td class="' + (c.n ? 'n' : '') + '">' + esc(c.ler(l)) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

  function desenhar(d){
    var p = d.periodo || {};
    $('resumo').textContent = num(p.visitas) + ' visitas' +
      (p.desde ? ' desde ' + p.desde.split('-').reverse().join('/') : ' (todo o histórico)') +
      ' · sem contar as visitas internas';

    desenharFunil(d.funil || []);
    $('nota-funil').textContent =
      'A porcentagem é sobre quem abriu a página. O teste tem ' + (p.perguntas || '?') + ' perguntas.';

    tabela('saidas', d.saidas, [
      { titulo:'Tela onde fechou', ler:function(l){ return rotulo(l.tela) === l.tela ? l.tela : rotulo(l.tela); } },
      { titulo:'Visitas', n:true, ler:function(l){ return num(l.n); } }
    ], 'Ninguém fechou a página sem terminar neste período.');

    tabela('criativos', d.criativos, [
      { titulo:'Anúncio', ler:function(l){ return l.criativo; } },
      { titulo:'Abriu', n:true, ler:function(l){ return num(l.abriu); } },
      { titulo:'Leads', n:true, ler:function(l){ return num(l.lead); } },
      { titulo:'Conversão', n:true, ler:function(l){ return (l.pct == null ? '—' : l.pct + '%'); } }
    ], 'Nenhuma visita neste período.');

    tabela('aparelhos', d.aparelhos, [
      { titulo:'Navegador', ler:function(l){ return l.app; } },
      { titulo:'Aparelho', ler:function(l){ return l.aparelho === 'movel' ? 'celular' : l.aparelho; } },
      { titulo:'Abriu', n:true, ler:function(l){ return num(l.abriu); } },
      { titulo:'Leads', n:true, ler:function(l){ return num(l.lead); } },
      { titulo:'Conversão', n:true, ler:function(l){ return (l.pct == null ? '—' : l.pct + '%'); } }
    ], 'Nenhuma visita neste período.');

    var t = d.tecnico || {};
    var cartoes = [
      { k:'carregamento típico', v:(t.ms_carga_mediano == null ? '—' : (t.ms_carga_mediano/1000).toFixed(1).replace('.', ',') + ' s') },
      { k:'carregou acima de 3 s', v:num(t.carga_lenta), alerta:t.carga_lenta > 0 },
      { k:'falhou ao enviar', v:num(t.erros_envio), alerta:t.erros_envio > 0 },
      { k:'saiu com número inválido', v:num(t.fone_invalido), alerta:t.fone_invalido > 0 },
      { k:'saiu sem digitar nada', v:num(t.fone_vazio) },
      { k:'abriu a página de venda', v:num(t.abriu_tsl) }
    ];
    $('tecnico').innerHTML = cartoes.map(function(c){
      return '<div class="cartao' + (c.alerta ? ' alerta' : '') + '">' +
             '<div class="v">' + esc(c.v) + '</div><div class="k">' + esc(c.k) + '</div></div>';
    }).join('');

    tabela('dias', (d.dias || []).slice().reverse(), [
      { titulo:'Dia', ler:function(l){ return l.dia.split('-').reverse().join('/'); } },
      { titulo:'Abriu', n:true, ler:function(l){ return num(l.abriu); } },
      { titulo:'Leads', n:true, ler:function(l){ return num(l.lead); } }
    ], 'Nenhuma visita neste período.');
  }

  // ── período ───────────────────────────────────────────────────────
  function desdeDe(dias){
    if (!dias) return null;
    var d = new Date();
    d.setDate(d.getDate() - (dias - 1));
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  var diasAtuais = 30;
  function carregar(){
    $('resumo').textContent = 'a carregar…';
    chamar(desdeDe(diasAtuais))
      .then(desenhar)
      .catch(function(e){
        if (e === 'sem_sessao') { esquecer(); mostrarLogin(); return; }
        $('resumo').textContent = 'Não consegui carregar agora. Recarregue a página.';
      });
  }

  $('periodos').addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if (!b) return;
    [].forEach.call(this.querySelectorAll('button'), function(x){ x.removeAttribute('aria-pressed'); });
    b.setAttribute('aria-pressed', 'true');
    diasAtuais = parseInt(b.getAttribute('data-dias'), 10);
    carregar();
  });

  // ── telas ─────────────────────────────────────────────────────────
  function mostrarLogin(){
    $('tela-login').classList.remove('oculto');
    $('tela-painel').classList.add('oculto');
    $('email').focus();
  }
  function mostrarPainel(){
    $('tela-login').classList.add('oculto');
    $('tela-painel').classList.remove('oculto');
    carregar();
  }

  $('btentrar').onclick = function(){
    var b = this, email = $('email').value.trim(), senha = $('senha').value;
    if (!email || !senha) return;
    b.disabled = true; b.textContent = 'a entrar…';
    $('erro-login').textContent = '';
    entrar(email, senha).then(function(d){
      b.disabled = false; b.textContent = 'Entrar';
      if (!d || !d.access_token) {
        $('erro-login').textContent = 'E-mail ou senha não conferem.';
        return;
      }
      guardar(d);
      $('senha').value = '';
      mostrarPainel();
    }).catch(function(){
      b.disabled = false; b.textContent = 'Entrar';
      $('erro-login').textContent = 'Não consegui falar com o servidor.';
    });
  };
  $('senha').onkeydown = function(e){ if (e.key === 'Enter') $('btentrar').click(); };
  $('btsair').onclick = function(){ esquecer(); mostrarLogin(); };

  // Já entrou antes? Tenta seguir sem pedir senha de novo.
  if (guardada()) { mostrarPainel(); } else { mostrarLogin(); }
})();
</script>
</body>
</html>

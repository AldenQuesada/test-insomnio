<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Venciendo el Insomnio en 7 días · Dr. Alden J. Quesada</title>
<meta name="description" content="El método completo del Dr. Alden J. Quesada para volver a dormir la noche entera, sin depender de medicamentos controlados.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<style>
/* Diagramação modelada na página de referência: fundo ameixa, roxo vivo nas
   seções de oferta, ouro nos títulos e nos botões, Sora em peso pesado e
   tudo centralizado. As cores saíram medidas da própria página. */
:root{
  --fundo:#120914; --fundo-2:#221225; --preto:#0c0c0c;
  --roxo:#7a2ff5; --ouro:#ffd04b; --branco:#fff; --cinza:#cfc6d4;
}
*{margin:0; padding:0; box-sizing:border-box}
/* Trava geral: a imagem dos dispositivos saiu do style embutido e
   passou a estourar 1100px de largura num telefone de 390. */
img{max-width:100%; height:auto; display:block}
.m-img img{width:100%; margin:0 auto 12px}
html{scroll-behavior:smooth}
body{
  font-family:Sora,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--fundo); color:var(--branco); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.faixa{padding:48px 22px; text-align:center}
.dentro{width:100%; max-width:620px; margin:0 auto}
.escura{background:var(--preto)}
.ameixa{background:var(--fundo-2)}
/* O roxo entra com a seta recortada no topo, como na página modelo: é ela que
   marca a virada do conteúdo para a oferta. */
.roxo{background:var(--roxo); position:relative; padding-top:68px}
.roxo::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  border-left:72px solid transparent; border-right:72px solid transparent;
  border-top:36px solid var(--fundo);
}

h1,h2{font-weight:800; line-height:1.1; letter-spacing:-.01em; text-transform:uppercase}
h1{font-size:clamp(28px,7.6vw,42px); color:var(--ouro); text-wrap:balance}
h2{font-size:clamp(22px,5.8vw,31px); margin-bottom:18px; text-wrap:balance}
h3{font-size:18px; font-weight:700; color:var(--ouro); margin-bottom:8px;
  text-transform:none}
p{font-size:16.5px; color:var(--cinza); margin-bottom:15px}
p:last-child{margin-bottom:0}
.roxo p, .roxo h2{color:var(--branco)}
.sobretitulo{color:var(--ouro); font-size:16px; font-weight:600; margin-bottom:12px}
.chamada{font-size:17px; font-weight:600; color:var(--branco);
  text-transform:uppercase; line-height:1.35; margin-bottom:18px}

/* ── herói ── */
.heroi img{width:100%; max-width:330px; display:block; margin:22px auto 6px}
.heroi .selo{
  display:inline-block; margin-top:18px; padding:8px 16px; border-radius:6px;
  background:rgba(255,208,75,.12); border:1px solid rgba(255,208,75,.35);
  font-size:13.5px; font-weight:600; color:var(--ouro);
}
.heroi p.sub{font-size:17px; color:var(--branco); margin-top:14px; font-weight:600}

/* ── botão ── */
a.cta{
  display:block; text-decoration:none; width:100%; text-align:center;
  background:linear-gradient(180deg,#ffd964,#f0b320);
  color:#221225; font-weight:800; font-size:17px; text-transform:uppercase;
  line-height:1.25; border-radius:5px; padding:19px 14px; margin-top:22px;
  box-shadow:0 8px 26px -10px rgba(255,208,75,.75);
}
a.cta:active{transform:translateY(1px)}
.cta-apoio{font-size:13.5px; color:var(--cinza); margin-top:10px}

/* ── listas ── */
ul.itens{list-style:none; text-align:left}
ul.itens li{
  position:relative; padding:0 0 15px 33px; font-size:16px; color:var(--cinza);
  margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,.1);
}
ul.itens li:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
ul.itens li .marca{
  position:absolute; left:0; top:2px; width:21px; height:21px; border-radius:50%;
  background:var(--ouro); display:grid; place-items:center;
}
ul.itens li .marca svg{width:12px; height:12px; color:#221225}
.roxo ul.itens li{color:var(--branco)}

/* ── blocos longos de texto ── */
.texto-longo{text-align:left}
.texto-longo h2{text-align:left}

/* ── preço ── */
.preco .de{font-size:16px; color:var(--cinza); text-decoration:line-through}
.preco .rot{font-size:13px; letter-spacing:.12em; text-transform:uppercase;
  margin-top:12px; color:var(--branco); font-weight:600}
.preco .por{font-weight:800; font-size:clamp(44px,12vw,62px); color:var(--ouro);
  line-height:1; letter-spacing:-.02em}
.preco .por small{font-size:23px}
.preco .apoio{font-size:14px; margin-top:12px}

/* ── garantia ── */
.garantia{background:var(--fundo-2); border:2px solid var(--ouro);
  border-radius:10px; padding:32px 24px}
.garantia .carimbo{
  width:92px; height:92px; margin:0 auto 18px; border-radius:50%;
  border:3px solid var(--ouro); display:grid; place-items:center;
  font-weight:800; font-size:21px; color:var(--ouro); line-height:1.05;
  text-transform:uppercase;
}

/* ── faq ── */
details{border-bottom:1px solid rgba(255,255,255,.14); padding:17px 0; text-align:left}
details:last-of-type{border-bottom:0}
summary{font-size:16.5px; font-weight:700; color:var(--branco); cursor:pointer;
  list-style:none; display:flex; justify-content:space-between; gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--ouro); font-size:22px; line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin-top:11px; font-size:15.5px}

.rodape{padding:38px 22px 52px; text-align:center; background:var(--preto)}
.rodape p{font-size:13px; color:#8a8192; max-width:520px; margin:0 auto 9px}
.rodape .marca{font-size:14px; color:var(--cinza); font-weight:700; margin-bottom:11px}

/* ── desktop ──
   A página modelo muda de comportamento aqui, e eu só tinha olhado o celular:
   o herói vira duas colunas com o texto à ESQUERDA e alinhado à esquerda, os
   blocos de imagem alternam o lado, os textos longos ficam numa coluna de 780
   e as listas e a FAQ abrem em duas colunas. */
@media (min-width:900px){
  .faixa{padding:80px 40px}
  .dentro{max-width:1180px}

  .heroi .dentro{
    display:grid; grid-template-columns:1.05fr .95fr; gap:16px 60px;
    grid-template-areas:"a img" "b img"; align-items:center; text-align:left;
  }
  .heroi .h-a{grid-area:a} .heroi .h-b{grid-area:b} .heroi .h-img{grid-area:img}
  .heroi img{max-width:430px; margin:0}
  .heroi h1{font-size:46px}
  .heroi .chamada{font-size:18px}

  .duas .dentro{display:grid; grid-template-columns:1fr 1fr; gap:56px;
    align-items:center; text-align:left}
  .duas img{width:100%; margin:0}

  .texto-longo .dentro{max-width:780px}
  ul.itens{display:grid; grid-template-columns:1fr 1fr; gap:0 44px}
  ul.itens li{border-bottom:0; padding-bottom:0; margin-bottom:26px}
  .faq-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 44px}
  .heroi a.cta{max-width:none; margin-left:0; margin-right:0}
  a.cta{max-width:560px; margin-left:auto; margin-right:auto}
  .garantia{max-width:760px; margin:0 auto}
}

.aviso-previa{background:var(--ouro); color:#221225; text-align:center;
  font-weight:800; font-size:12.5px; letter-spacing:.05em; padding:9px 16px}
.oculto{display:none}
</style>

<div id="previa" class="aviso-previa oculto"></div>
<main id="pagina"></main>

<script src="../config.js"></script>
<script>
(function(){
  var CFG = window.QUIZ_CONFIG || {};
  var url = new URLSearchParams(location.search);
  // Dados que o resultado do quiz passa adiante: a página abre falando do caso
  // dela, não de uma dor genérica.
  var pessoa = { nome: url.get('n') || '', faixa: url.get('f') || '', pior: url.get('p') || '' };
  var PREVIA = url.get('ver') !== null;
  var T = {}, CHECKOUT = '';

  function esc(x){
    return String(x == null ? '' : x)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var TIQUE = '<span class="marca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span>';

  function secao(conteudo, classe){
    return conteudo
      ? '<section class="faixa ' + (classe || '') + '"><div class="dentro">' +
        conteudo + '</div></section>'
      : '';
  }

  function botao(b){
    // Sem link de checkout o botão não existe. Botão que não leva a lugar
    // nenhum custa mais caro que botão nenhum.
    if (!b || !b.texto || !CHECKOUT) return '';
    return '<a class="cta" href="' + esc(CHECKOUT) + '" rel="noopener">' +
      esc(b.texto) + '</a>' +
      (b.apoio ? '<p class="cta-apoio">' + esc(b.apoio) + '</p>' : '');
  }

  var BLOCOS = {
    heroi: function(c){
      if (!c.titulo) return '';
      return secao(
        '<div class="h-a">' +
          (c.sobretitulo ? '<p class="sobretitulo">' + esc(c.sobretitulo) + '</p>' : '') +
          (c.chamada ? '<p class="chamada">' + esc(c.chamada) + '</p>' : '') +
          '<h1>' + esc(c.titulo) + '</h1></div>' +
        (c.imagem ? '<div class="h-img"><img src="' + esc(c.imagem) +
                    '" alt="" width="330" height="495"></div>' : '') +
        '<div class="h-b">' +
          (c.pos_titulo ? '<h2>' + esc(c.pos_titulo) + '</h2>' : '') +
          (c.subtitulo ? '<p class="sub">' + esc(c.subtitulo) + '</p>' : '') +
          (c.selo ? '<span class="selo">' + esc(c.selo) + '</span>' : '') +
          botao(T.cta1) +
        '</div>', 'heroi ameixa');
    },
    cta1: function(){ return ''; },
    cta2: function(c){ return secao(botao(c)); },
    cta3: function(c){ return secao(botao(c)); },

    prova: function(c){
      if (!c.texto && !c.imagem) return '';
      return secao((c.titulo ? '<h2>' + esc(c.titulo) + '</h2>' : '') +
        (c.imagem ? '<img src="' + esc(c.imagem) + '" alt="" style="width:100%;border-radius:12px;margin-bottom:18px">' : '') +
        (c.texto ? '<p>' + esc(c.texto) + '</p>' : ''), 'escura');
    },

    mockups: function(c){
      var ims = c.imagens || [];
      if (!ims.length) return '';
      return secao(
        '<div class="m-img">' + ims.map(function(u){
          return '<img src="' + esc(u) + '" alt="">';
        }).join('') + '</div>' +
        '<div class="m-txt"><h2>' + esc(c.titulo || '') + '</h2>' +
        (c.texto ? '<p>' + esc(c.texto) + '</p>' : '') + '</div>', 'duas');
    },

    autor: function(c){
      if (!c.bio) return '';
      return secao(
        (c.foto ? '<img src="' + esc(c.foto) + '" alt="" style="width:148px;height:148px;border-radius:50%;object-fit:cover;margin-bottom:20px">' : '') +
        '<h2>' + esc(c.nome || '') + '</h2>' +
        c.bio.split('\n').map(function(p){ return '<p>' + esc(p) + '</p>'; }).join(''), 'escura');
    },

    revelacao: function(c){
      if (!c.texto) return '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2>' +
        c.texto.split('\n').map(function(p){ return '<p>' + esc(p) + '</p>'; }).join(''),
        'escura texto-longo');
    },

    beneficios: function(c){
      var it = c.itens || [];
      if (!it.length) return '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2><ul class="itens">' +
        it.map(function(t){ return '<li>' + TIQUE + esc(t) + '</li>'; }).join('') +
        '</ul>', 'escura');
    },

    bonus: function(c){
      var it = c.itens || [];
      if (!it.length) return '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2>' +
        it.map(function(b){
          return '<div style="border:1px solid var(--linha);border-radius:14px;padding:22px;margin-bottom:14px">' +
            '<h3>' + esc(b.nome || '') + '</h3><p>' + esc(b.texto || '') + '</p>' +
            (b.valor ? '<p style="color:var(--lua);font-weight:600;margin-top:10px">' +
                       esc(b.valor) + '</p>' : '') + '</div>';
        }).join(''));
    },

    preco: function(c){
      if (!c.por) return '';
      return secao('<div class="preco">' +
        (c.de ? '<p class="de">' + esc(c.rotulo_de || '') + ' ' + esc(c.de) + '</p>' : '') +
        '<p class="rot">' + esc(c.rotulo_por || '') + '</p>' +
        '<div class="por"><small>' + esc(c.moeda || '') + '</small> ' + esc(c.por) + '</div>' +
        (c.apoio ? '<p class="apoio">' + esc(c.apoio) + '</p>' : '') +
        '</div>', 'roxo');
    },

    garantia: function(c){
      if (!c.texto) return '';
      return secao('<div class="garantia">' +
        (c.selo ? '<div class="carimbo">' + esc(c.selo).replace(' ', '<br>') + '</div>' : '') +
        '<h2>' + esc(c.titulo || '') + '</h2><p>' + esc(c.texto) + '</p></div>');
    },

    contador: function(c){ return c.titulo && c.ate ? secao('<h2>' + esc(c.titulo) + '</h2>') : ''; },

    resumo: function(c){
      var it = c.itens || [];
      if (!it.length) return '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2><ul class="itens">' +
        it.map(function(t){ return '<li>' + TIQUE + esc(t) + '</li>'; }).join('') +
        '</ul>', 'escura');
    },

    faq: function(c){
      var it = c.itens || [];
      if (!it.length) return '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2><div class="faq-grid">' +
        it.map(function(q){
          return '<details><summary>' + esc(q.p) + '</summary><p>' + esc(q.r) + '</p></details>';
        }).join('') + '</div>');
    },

    rodape: function(c){
      return '<section class="rodape"><div class="dentro">' +
        (c.marca ? '<p class="marca">' + esc(c.marca) + '</p>' : '') +
        (c.cnpj ? '<p>' + esc(c.cnpj) + '</p>' : '') +
        (c.aviso ? '<p>' + esc(c.aviso) + '</p>' : '') + '</div></section>';
    }
  };

  // Abertura falando do caso dela, quando o quiz mandou os dados.
  function saudacao(){
    if (!pessoa.nome && !pessoa.faixa) return '';
    var t = pessoa.nome ? pessoa.nome + ', ' : '';
    if (pessoa.pior) t += 'lo que más te pesa es ' + pessoa.pior + '. ';
    t += 'Esto fue escrito exactamente para eso.';
    return secao('<p style="font-size:18px;color:var(--luz)">' + esc(t) + '</p>');
  }

  fetch(CFG.url + '/rest/v1/quiz_templates?select=schema&slug=eq.' + CFG.slug + '&active=eq.true', {
    headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon }
  }).then(function(r){ return r.json(); }).then(function(linhas){
    if (!linhas || !linhas.length) throw new Error('página no encontrada');
    T = linhas[0].schema.tsl_es || {};
    CHECKOUT = T.checkout || '';
    // Na conferência os botões aparecem mesmo sem checkout: é essa copy que
    // mais precisa ser lida antes de existir para onde mandar.
    if (PREVIA && !CHECKOUT) CHECKOUT = '#';
    if (PREVIA) {
      var av = document.getElementById('previa');
      av.textContent = 'VISTA PREVIA · faltan bonos, testimonios, bio y checkout';
      av.classList.remove('oculto');
    }
    var html = '';
    (T.ordem || []).forEach(function(nome, i){
      if (i === 1) html += saudacao();
      if (BLOCOS[nome]) html += BLOCOS[nome](T[nome] || {});
    });
    document.getElementById('pagina').innerHTML = html;
  }).catch(function(e){
    document.getElementById('pagina').innerHTML =
      '<section class="faixa"><div class="dentro"><h2>No pude cargar la página</h2>' +
      '<p>Recarga en unos instantes.</p></div></section>';
  });
})();
</script>

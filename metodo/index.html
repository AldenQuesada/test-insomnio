<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Venciendo el Insomnio en 7 días · Dr. Alden J. Quesada</title>
<meta name="description" content="El método completo del Dr. Alden J. Quesada para volver a dormir la noche entera, sin depender de medicamentos controlados.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* Identidade da marca, da folha dela. A paleta anterior era a da página que
   serviu de modelo de ESTRUTURA, não de marca, e isso eu tinha misturado. */
:root{
  --noite:#111b32;        /* confiança, profundidade */
  --noite-2:#17223d;
  --noite-3:#0c1426;
  --clareza:#f4f0e8;      /* clareza, equilíbrio, paz */
  --saude:#d8b879;        /* vitalidade, esperança */
  --calma:#b7aacd;        /* tranquilidade, harmonia */
  --apoio:#c3c9d8;
}
*{margin:0; padding:0; box-sizing:border-box}
img{max-width:100%; height:auto; display:block}
html{scroll-behavior:smooth}
body{
  font-family:Montserrat,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--noite); color:var(--clareza); line-height:1.55;
  overflow-x:hidden; overflow-x:clip;
  -webkit-font-smoothing:antialiased;
}
.faixa{padding:86px 40px; text-align:center}
.dentro{width:100%; max-width:1280px; margin:0 auto}
/* Ritmo das dobras. Antes cada bloco pedia a própria cor e dava oito faixas
   seguidas no mesmo tom: a página inteira virava um bloco só. Agora a
   alternância é do lugar, não do bloco, então ela sobrevive a mudar a ordem no
   banco. Os dois tons são os da folha dela, usados nos extremos para render o
   máximo de contraste que a paleta permite. */
#pagina > section.faixa:nth-of-type(odd){background:var(--noite-3)}
#pagina > section.faixa:nth-of-type(even){background:var(--noite-2)}
#pagina > section.faixa + section.faixa{border-top:1px solid rgba(244,240,232,.07)}
/* `.faixa` junto para empatar com a regra da alternância acima: sem ele a
   pseudo-classe ganhava e o herói perdia a própria cor. */
#pagina > section.faixa.heroi{background:var(--noite); border-top:0; padding-top:30px}
@media (min-width:900px){ #pagina > section.faixa.heroi{padding-top:44px} }
.escura{background:var(--noite-3)}
.ameixa{background:var(--noite)}
.o2-img{width:100%; max-width:330px; margin:26px auto 4px}
@media (min-width:900px){ .o2-img{max-width:400px} }
.roxo{background:var(--noite-2); position:relative; padding-top:68px}
.roxo::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  border-left:72px solid transparent; border-right:72px solid transparent;
  border-top:36px solid var(--noite);
}

/* O título monta o bloco da capa: apoio em Montserrat e a palavra forte em
   Bebas Neue, que é o tipo condensado da marca. */
h1{
  font-family:Montserrat,sans-serif; font-weight:300;
  font-size:clamp(28px,3.6vw,52px); line-height:1.08; letter-spacing:-.01em;
  color:var(--clareza); text-transform:none; text-wrap:balance;
}
h1 .forte{
  font-family:"Bebas Neue",Impact,sans-serif; font-weight:400;
  font-size:1.5em; letter-spacing:.01em; color:var(--saude);
  line-height:.92; display:inline-block; vertical-align:-.06em;
}
h2{font-family:Montserrat,sans-serif; font-size:clamp(20px,1.67vw,24px);
  font-weight:600; line-height:1.5; margin-bottom:14px; text-transform:uppercase;
  letter-spacing:.01em; text-wrap:balance}
h3{font-family:Lora,Georgia,serif; font-size:19px; font-weight:600;
  color:var(--saude); margin-bottom:8px}
/* O corpo é Lora, que é o tipo de leitura da marca. */
p{font-family:Lora,Georgia,serif; font-size:17px; color:var(--apoio); margin-bottom:15px}
p:last-child{margin-bottom:0}
.sobretitulo{font-family:Montserrat,sans-serif; color:var(--saude);
  font-size:clamp(16px,1.39vw,20px); font-weight:300; letter-spacing:.14em;
  text-transform:uppercase; line-height:1.3; margin-bottom:16px}
.chamada{font-family:Montserrat,sans-serif; font-size:clamp(15px,1.25vw,18px);
  font-weight:400; color:var(--clareza); text-transform:uppercase;
  letter-spacing:.02em; line-height:1.4; margin-bottom:22px}

/* ── herói ── */
.heroi .h-b{margin-top:30px}
.heroi img{margin:24px auto 0}
.heroi p.sub{font-family:Lora,serif; font-size:clamp(15.5px,1.25vw,18px);
  font-weight:400; line-height:1.45; color:var(--clareza); margin-top:0}
.heroi .selo{
  display:inline-block; margin-top:18px; padding:8px 16px; border-radius:4px;
  background:rgba(216,184,121,.12); border:1px solid rgba(216,184,121,.4);
  font-family:Montserrat,sans-serif; font-size:13px; font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; color:var(--saude);
}
.heroi-leitura h1{font-size:clamp(30px,3.15vw,44px); font-weight:600;
  line-height:1.16; letter-spacing:-.02em}
.heroi-leitura .sobretitulo{font-size:clamp(15px,1.35vw,18px); font-weight:500;
  line-height:1.5; letter-spacing:.01em; text-transform:none}
.heroi-leitura .h-b h2{font-size:clamp(20px,1.8vw,25px); line-height:1.35;
  color:var(--saude); text-transform:none}
.h-img-desk{display:none}
.citacao{display:flex; gap:16px; align-items:center; margin-top:24px; text-align:left}
.citacao img{width:74px; height:74px; border-radius:50%; object-fit:cover; flex:none;
  border:2px solid var(--saude)}
.citacao p{font-family:Lora,serif; font-size:15.5px; font-style:italic;
  color:var(--clareza); margin:0}
/* A assinatura: mesma fonte e mesmo itálico da fala, porque é a mesma voz. */
.citacao .assina{display:block; margin-top:9px; color:var(--saude);
  font-weight:600}

/* ── botão ── */
a.cta{
  display:block; text-decoration:none; width:100%; text-align:center;
  font-family:Montserrat,sans-serif; font-weight:700;
  font-size:clamp(16px,1.6vw,23px); letter-spacing:.03em;
  background:var(--saude); color:var(--noite);
  text-transform:uppercase; line-height:1.18; border-radius:5px;
  padding:22px 16px; margin-top:26px;
  box-shadow:0 10px 30px -12px rgba(216,184,121,.7);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
a.cta:hover{background:#e7cb92; transform:translateY(-2px);
  box-shadow:0 16px 38px -12px rgba(216,184,121,.85)}
a.cta:active{transform:translateY(0)}
a.cta:focus-visible{outline:3px solid var(--calma); outline-offset:3px}
.cta-apoio{font-family:Montserrat,sans-serif; font-size:13.5px;
  color:var(--apoio); margin-top:11px}

/* O livro respira de leve, como quem dorme. Pausa para quem pediu menos
   movimento no sistema: animação em laço é o que mais incomoda. */
@keyframes respira{from{transform:translateY(0)} to{transform:translateY(-14px)}}
.heroi img, .m-img img{animation:respira 4.5s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){
  .heroi img, .m-img img{animation:none}
  a.cta{transition:none}
}

/* ── prévia folheável ── */
.previa{margin-top:26px}
/* Corte só em CIMA e EMBAIXO. No meio da virada a ponta da folha descia
   além do livro e invadia os botões, por isso o corte vertical. Os lados
   ficam livres: no celular a folha que vira gira para a esquerda, para fora
   da página única, e com o corte nos lados ela sumia inteira e a página da
   esquerda nunca aparecia. `clip-path` com margem lateral negativa faz isso
   e funciona também em iPhone antigo, onde `overflow: clip` não existe. */
#folheto{margin:0 auto; max-width:1040px;
  -webkit-clip-path:inset(0 -100vw); clip-path:inset(0 -100vw)}
/* A folha girando para fora não pode criar rolagem lateral na página. */
[data-bloco="previa"]{overflow-x:hidden; overflow-x:clip}
#folheto .pagina{background:var(--clareza)}
/* `display:block`: imagem em linha deixa o vão da linha de base embaixo, e
   esse vão aparecia como um filete claro sob cada página. */
#folheto .pagina img{width:100%; height:100%; object-fit:cover; display:block}
/* A última página é a imagem do caminho, e o botão fica em cima do último
   passo: a curiosidade é ver como a noite termina. */
#folheto .mapa{background:#111b32}
#folheto .mapa img{object-position:center top}
/* Altura em % da folha: com altura fixa, no computador a folha é mais alta e
   o passo 3 aparecia inteiro embaixo do botão. Só a bandeirinha e a pontinha
   do cartão ficam de fora, de propósito. */
#folheto .mapa .pv-cta{top:83.5%; bottom:auto; height:11%; padding:0;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(14px, 2.2vw, 20px)}
/* O convite na última página. Fica sobre o rodapé da folha, com um véu por
   baixo para não brigar com o texto do miolo. */
.pv-cta{position:absolute; left:8%; right:8%; bottom:7%;
  display:block; text-align:center; text-decoration:none;
  font-family:Montserrat,sans-serif; font-weight:700; font-size:14px;
  letter-spacing:.06em; text-transform:uppercase;
  background:var(--saude); color:var(--noite);
  padding:13px 10px; border-radius:7px;
  box-shadow:0 10px 30px rgba(12,20,38,.45)}
.pv-cta:hover{background:var(--clareza)}
.previa-passos{display:flex; align-items:center; justify-content:center; gap:20px;
  margin-top:22px; font-family:Montserrat,sans-serif; font-size:14px;
  letter-spacing:.1em; color:var(--apoio)}
.pv{width:44px; height:44px; border-radius:50%; cursor:pointer;
  background:transparent; border:1px solid var(--saude); color:var(--saude);
  font-size:24px; line-height:1; transition:background .18s ease, color .18s ease}
.pv:hover{background:var(--saude); color:var(--noite)}

/* ── listas ── */
ul.itens{list-style:none; text-align:left}
ul.itens li{position:relative; padding:0 0 15px 34px; font-family:Lora,serif;
  font-size:16px; color:var(--apoio); margin-bottom:15px;
  border-bottom:1px solid rgba(244,240,232,.1)}
ul.itens li:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
ul.itens li .marca{position:absolute; left:0; top:2px; width:21px; height:21px;
  border-radius:50%; background:var(--saude); display:grid; place-items:center}
ul.itens li .marca svg{width:12px; height:12px; color:var(--noite)}

.texto-longo{text-align:left}
.texto-longo h2{text-align:left}
.m-img img{width:100%; margin:0 auto 12px}
/* No celular a faixa tem 40px de margem de cada lado, e isso tira 80px dos
   390 da tela. Num mockup de cinco peças cada capa fica com menos de 70px e o
   nome do livro some. Aqui ele fura a margem: o que precisa ser lido é a capa,
   não o respiro. */
@media (max-width:899px){
  .m-img{width:calc(100% + 56px); margin-left:-28px; max-width:none}
}

/* ── preço ── */
.preco .de{font-family:Montserrat,sans-serif; font-size:16px; color:var(--apoio);
  text-decoration:line-through}
.preco .rot{font-family:Montserrat,sans-serif; font-size:13px; letter-spacing:.14em;
  text-transform:uppercase; margin-top:12px; color:var(--calma); font-weight:500}
.preco .por{font-family:"Bebas Neue",sans-serif; font-size:clamp(52px,9vw,86px);
  color:var(--saude); line-height:1; letter-spacing:.01em}
.preco .por small{font-size:.35em}
.preco .apoio{font-family:Montserrat,sans-serif; font-size:14px; margin-top:12px}
/* A pilha: nome à esquerda, valor à direita, com um pontilhado ligando os dois.
   É o pontilhado que faz a coluna da direita virar uma soma aos olhos. */
.pilha{list-style:none; max-width:620px; margin:30px auto 10px; text-align:left}
.pilha li{display:flex; align-items:baseline; gap:10px; padding:13px 0;
  border-bottom:1px solid rgba(244,240,232,.13); font-family:Montserrat,sans-serif;
  font-size:15.5px; line-height:1.45}
.pilha .marca{flex:none}
.pilha li.com-capa{align-items:center; padding:16px 0}
.p-capa{width:96px; height:auto; flex:none; border-radius:3px;
  box-shadow:0 4px 14px rgba(0,0,0,.45)}
.p-nome{flex:1; min-width:0; overflow-wrap:anywhere;
  border-bottom:1px dotted rgba(244,240,232,.25); padding-bottom:3px}
.p-val{flex:none; font-weight:700; color:var(--saude); white-space:nowrap;
  display:flex; flex-direction:column; align-items:flex-end; gap:5px}
.p-val s{opacity:.6; font-weight:600; text-decoration-thickness:2px}
/* Verde de «grátis»: a única cor da página fora da paleta, de propósito. É
   ela que tem que saltar no meio do dourado dos preços. */
.p-gratis{background:#2fd47a; color:#0c1426; font-weight:800; font-size:13px;
  letter-spacing:.08em; padding:4px 10px; border-radius:999px;
  box-shadow:0 0 14px rgba(47,212,122,.45)}
@media (min-width:900px){ .p-capa{width:110px} }
.preco .de s{text-decoration-thickness:2px; opacity:.75}
.preco .reducao{font-family:Montserrat,sans-serif; font-weight:700; font-size:16px;
  color:var(--saude); margin-top:10px}

/* ── galeria ──
   Uma foto por tela no celular, três no computador. A altura nunca passa de
   70% da tela, para a foto inteira caber sem rolar. */
.gal{max-width:1100px; margin:0 auto}
.transicao + .gal{margin-top:34px}
.gal-pista{display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; scrollbar-width:none}
.gal-pista::-webkit-scrollbar{display:none}
.gal-item{flex:0 0 100%; scroll-snap-align:center; margin:0;
  height:min(70vh, 520px); border-radius:14px; overflow:hidden; background:var(--noite-2)}
.gal-item img{width:100%; height:100%; object-fit:cover; display:block}
.gal-vazio{display:flex; align-items:center; justify-content:center;
  border:2px dashed rgba(216,184,121,.45); background:var(--noite-3)}
.gal-vazio span{font-family:Montserrat,sans-serif; font-size:13px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--saude)}
.gal-pontos{display:flex; justify-content:center; gap:8px; margin-top:16px}
.gal-pontos i{width:8px; height:8px; border-radius:50%; background:rgba(244,240,232,.25); cursor:pointer}
.gal-pontos i.on{background:var(--saude)}
@media (min-width:900px){ .gal-item{flex-basis:calc(33.333% - 10px); height:min(60vh, 460px)} }

/* ── depoimentos ──
   Carrossel nativo: a pista rola na horizontal e cada card encaixa no lugar.
   Sem biblioteca, e com arrasto no dedo funcionando por padrão. */
.dep{margin-top:34px}
.dep-pista{display:flex; gap:18px; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;
  padding-bottom:4px}
.dep-pista::-webkit-scrollbar{display:none}
.dep-card{flex:0 0 100%; scroll-snap-align:center; background:var(--clareza);
  border-radius:14px; overflow:hidden; text-align:left; display:flex;
  flex-direction:column}
.dep-foto{width:100%; aspect-ratio:4/3; object-fit:cover; display:block}
.dep-corpo{padding:22px 22px 24px; display:flex; flex-direction:column; gap:14px;
  flex:1}
.dep-txt{font-family:Lora,Georgia,serif; font-size:16px; line-height:1.65;
  color:#43484f; margin:0; flex:1}
.dep-quem{font-family:Montserrat,sans-serif; font-size:13.5px; margin:0;
  color:#6d7380}
.dep-quem b{display:block; font-size:15px; color:var(--noite); margin-bottom:2px}
.dep-passos{display:flex; align-items:center; justify-content:center; gap:20px;
  margin-top:22px; font-family:Montserrat,sans-serif; font-size:14px;
  color:var(--apoio); letter-spacing:.06em}
@media (min-width:760px){ .dep-card{flex-basis:calc(50% - 9px)} }
@media (min-width:1100px){ .dep-card{flex-basis:calc(33.333% - 12px)} }

/* Frase de passagem: na modelo ela é maior que um parágrafo e menor que um
   título, e é o que separa a prova da história. */
.transicao{font-family:Lora,Georgia,serif; font-size:21px; line-height:1.5;
  max-width:760px; margin:0 auto; color:var(--clareza)}
/* ── letreiro do topo ──
   Faixa fixa, o texto correndo como em telejornal. Fica por cima de tudo e o
   corpo ganha a altura dela de recuo, senão o herói nasce escondido. */
.letreiro{cursor:pointer; position:relative; z-index:60; height:38px;
  display:flex; align-items:center; overflow:hidden;
  background:var(--noite-3); border-bottom:1px solid rgba(216,184,121,.35)}
.le-pista{display:flex; white-space:nowrap; will-change:transform;
}
.le-fita{font-family:Montserrat,sans-serif; font-size:13px; font-weight:600;
  letter-spacing:.03em; color:var(--clareza); padding-right:0}
.le-fita i{font-style:normal; color:var(--saude); margin:0 6px}
@keyframes correr{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
/* Letreiro correndo sem parar é exatamente o que dispara enjoo de movimento.
   Quem marca a opção continua com a faixa, parada e arrastável. */
.letreiro.parado{overflow-x:auto; scrollbar-width:none}
.letreiro.parado::-webkit-scrollbar{display:none}
.letreiro.parado .le-pista [aria-hidden]{display:none}
@media (min-width:900px){ .le-fita{font-size:14px} }

/* Sem caixa alta aqui: o destaque pedido é o «Hoy» com maiúscula, e
   tudo em maiúsculas apagaria justamente essa diferença. */
.cta-preco .hoy{font-weight:700; color:var(--saude); margin-left:4px}
.barra-txt s{opacity:.65}

/* ── barra fixa do celular ── */
.barra{display:none}
@media (max-width:899px){
  /* Escondida abaixo da tela até o botão do herói sair de vista: no herói ela
     só repetiria o botão que já está ali. */
  .barra{display:flex; align-items:center; gap:12px; position:fixed; left:0; right:0;
    bottom:0; z-index:70; background:var(--noite-3);
    transform:translateY(110%); transition:transform .35s ease;
    border-top:1px solid rgba(216,184,121,.35);
    padding:11px 14px calc(11px + env(safe-area-inset-bottom, 0px))}
  body.com-barra{padding-bottom:calc(100px + env(safe-area-inset-bottom, 0px))}
  /* Mesmo corte da barra: quando ela existe, o relógio dela basta. Os dois
     contadores grandes só repetiriam a mesma hora na mesma tela. */
  .barra.visivel{transform:none}
  body.com-barra-contador .faixa:not(.heroi) .conta{display:none}
  .barra-esq{flex:1; min-width:0}
  .barra-txt{font-family:Montserrat,sans-serif; font-size:12.5px; line-height:1.3;
    color:var(--clareza); margin:0}
  .barra-txt b{color:var(--saude); font-weight:800}
  .barra-apoio{font-family:Montserrat,sans-serif; font-size:11.5px;
    line-height:1.35; color:var(--apoio); margin:4px 0 0; overflow-wrap:anywhere}
  .barra-rel{font-family:Montserrat,sans-serif; font-weight:800; font-size:17px;
    letter-spacing:.04em; color:var(--saude); margin:3px 0 0;
    font-variant-numeric:tabular-nums}
  .barra-btn{flex:0 1 auto; max-width:62%; min-width:0; text-align:center;
    overflow-wrap:anywhere; background:var(--saude); color:var(--noite);
    font-family:Montserrat,sans-serif; font-weight:800; font-size:13.5px;
    letter-spacing:.03em; text-decoration:none; padding:14px 18px;
    border-radius:999px; box-shadow:0 0 22px rgba(216,184,121,.35)}
}

/* ── contador ── */
.conta{margin:26px auto 0; max-width:420px}
.heroi .conta{margin:22px 0 24px}
.conta-tit{font-family:Montserrat,sans-serif; font-size:13px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--saude);
  margin-bottom:13px}
.conta-cxs{display:flex; gap:12px; justify-content:center}
.heroi .conta-cxs{justify-content:center}
.conta-cx{text-align:center; background:var(--noite-3); border:1px solid rgba(216,184,121,.4);
  border-radius:9px; padding:11px 0 9px; min-width:92px}
.conta-cx b{display:block; font-family:"Bebas Neue",sans-serif; font-size:42px;
  line-height:1; color:var(--clareza); letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.conta-cx span{display:block; font-family:Montserrat,sans-serif; font-size:11px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--apoio); margin-top:5px}
.conta.zerado .conta-cx b{color:var(--apoio)}
@media (min-width:900px){ .heroi .conta-cxs{justify-content:flex-start} }

/* O riscado embaixo do botão, a partir do segundo. */
.cta-preco{font-family:Montserrat,sans-serif; font-size:15px; margin-top:13px;
  color:var(--apoio)}

<script>
(function(){
  var CFG = window.QUIZ_CONFIG || {};
  var url = new URLSearchParams(location.search);

  // dela, não de uma dor genérica.
  var pessoa = { nome: url.get('n') || '', faixa: url.get('f') || '', pior: url.get('p') || '' };

  var T = {}, ESQ = {}, CHECKOUT = '';

  function esc(x){
    return String(x == null ? '' : x)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function formato(x){

      return '<strong>' + (dupla || simples) + '</strong>';

    return (Array.isArray(texto) ? texto : [texto]).map(function(t){
      return String(t == null ? '' : t).split(/\r?\n/).map(function(p){
        return p.trim()
          ? '<p' + (classe ? ' class="' + esc(classe) + '"' : '') + '>' + formato(p) + '</p>'
          : '';

    if (!valor) return '';
    try {
      var u = new URL(String(valor), location.href);

    } catch (e) { return ''; }

  var CADEADO = '<svg class="r-cad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function secao(conteudo, classe){
    return conteudo
      ? '<section class="faixa ' + (classe || '') + '"><div class="dentro">' +
        conteudo + '</div></section>'
      : '';
  }

  // ── letreiro do topo ──────────────────────────────────────────────
  // Quem respondeu o quiz deixou o resultado no próprio aparelho. Aqui a
  // página lê de lá para continuar a conversa em vez de recomeçar do zero.
  // Nada disso veio pela URL, de propósito: é dado de saúde.
  function lerResultado(){
    try {
      var r = JSON.parse(localStorage.getItem('insonia_resultado') || 'null');
      if (!r || r.v !== 1) return null;
      // Resultado velho descreve uma noite que já passou. Trinta dias.
      if (Date.now() - (r.quando || 0) > 2592000000) return null;

    } catch (e) { return null; }

  // Traduz os códigos guardados usando o MESMO schema que o quiz usa. A
  // tabela de classificação existe num lugar só, e é lá.
  function enfeixar(r){
    var d = { nome: (r.nome || '').split(' ')[0], nota: r.nota, maximo: r.maximo,
              faixa: '', clase: '' };
    // Os rótulos vêm do PDF, onde são TÍTULO e por isso começam em maiúscula.
    // Aqui entram no meio da frase, e em espanhol «tu insomnio es Crónico» é

    function corrido(t){ t = String(t || ''); return t.charAt(0).toLowerCase() + t.slice(1); }
    (ESQ.faixas_es || []).forEach(function(f){
      if (f.codigo === r.faixa) d.faixa = corrido(f.titulo || f.rotulo);
    });
    var q = (ESQ.perguntas || []).filter(function(x){ return x.id === 'dur'; })[0];
    var o = ((q && q.opcoes_es) || []).filter(function(x){ return x.valor === r.dur; })[0];
    var cl = (ESQ.pdf_es || {}).p4_clases || {};

      'background:#fff;color:#111;font:13px/1.45 monospace;padding:10px;border-radius:6px';

          .replace(/%clase%/g, d.clase);

      // vez de entrar pela metade.

    // de CSS. A animação de CSS se comporta diferente no motor do iPhone (que

    // parado. Movendo na mão, todo motor faz igual.
    var pista = el.querySelector('.le-pista');
    var fita  = el.querySelector('.le-fita');
    var vel   = parseInt(c.velocidade, 10) || 70;   // pixels por segundo
    var reduz = false;
    try { reduz = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    // Decisão dela: o letreiro anda mesmo com «Reduzir movimento» ligado no
    // aparelho (o iPhone dela está assim, e com ele parado o letreiro não
    // cumpre a função). Nesse caso anda mais devagar, e em qualquer caso um
    // toque pausa e outro retoma: é a saída para quem passa mal com movimento.
    if (reduz) vel = parseInt(c.velocidade_reduzida, 10) || Math.round(vel / 2);
    var pausado = false;
    el.addEventListener('click', function(){ pausado = !pausado; });

    var x = 0, antes = 0, largura = 0;
    function passo(t){
      if (!largura) largura = fita.getBoundingClientRect().width;
      if (antes && largura && !pausado) {
        x -= vel * Math.min(0.1, (t - antes) / 1000);
        if (x <= -largura) x += largura;   // a 2ª cópia ocupou o lugar da 1ª
        pista.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
      }
      antes = t;
      requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
    diag(el, reduz, true);
  }

  // Barra fixa no rodapé do celular: oferta e prazo à esquerda, botão à
  // direita, sempre onde o polegar está. Lê o MESMO prazo dos contadores.
  function montarBarra(c){
    if (!c || !c.botao || !CHECKOUT) return;
    var contar = c.contador !== false;
    var p = T.preco || {};
    var preco = (p.moeda ? p.moeda + ' ' : '') + (p.por || '');
    var de = (p.moeda ? p.moeda + ' ' : '') + (c.de || '');
    // Desconto calculado, nunca escrito: se o preço mudar, o % acompanha.
    function num(v){ return parseFloat(String(v || '').replace(',', '.')) || 0; }
    var off = num(c.de) ? Math.round((1 - num(p.por) / num(c.de)) * 100) : 0;
    var txt = esc(c.texto || '').replace('%off%', '<b>' + off + '% OFF</b>')
                                 .replace('%preco%', '<b>' + esc(preco) + '</b>')
                                 .replace('%de%', '<s>' + esc(de) + '</s>');
    var el = document.createElement('div');
    el.className = 'barra';
    el.innerHTML = '<div class="barra-esq"><p class="barra-txt">' + txt + '</p>' +
      (c.apoio ? '<p class="barra-apoio">' + formato(c.apoio) + '</p>' : '') +
      (contar ? '<p class="barra-rel" id="barra-rel">00:15:00</p>' : '') + '</div>' +
      '<a class="barra-btn" href="' + esc(CHECKOUT) + '" rel="noopener">' + esc(c.botao) + '</a>';
    document.body.appendChild(el);
    document.body.classList.add('com-barra');
    if (contar) {
      document.body.classList.add('com-barra-contador');
      var rel = document.getElementById('barra-rel');
      var pintar = function(){
        var ate = 0; try { ate = parseInt(localStorage.getItem('oferta_ate'), 10) || 0; } catch (e) {}
        if (!ate) return;
        var s = Math.max(0, Math.floor((ate - Date.now()) / 1000));
        rel.textContent = [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
          .map(function(n){ return String(n).padStart(2,'0'); }).join(':');
      };
      pintar(); setInterval(pintar, 1000);
    }

    // Aparece quando o botão do herói SAI da tela por cima (a pessoa rolou
    // para baixo); some de novo se ela voltar até ele.
    var alvo = document.querySelector('.heroi a.cta');
    if (!alvo || !('IntersectionObserver' in window)) { el.classList.add('visivel'); return; }
    new IntersectionObserver(function(es){
      es.forEach(function(e){
        el.classList.toggle('visivel', !e.isIntersecting && e.boundingClientRect.top < 0);
      });
    }).observe(alvo);
  }

  // Marcação do contador. Só o desenho: a conta roda em `ligarContagem`.
  function contagem(c){
    if (!c || !c.minutos) return '';
    var r = c.rotulos || {};
    return '<div class="conta">' +
      (c.titulo ? '<p class="conta-tit">' + esc(c.titulo) + '</p>' : '') +
      '<div class="conta-cxs">' +
        '<div class="conta-cx"><b data-u="h">00</b><span>' + esc(r.horas || '') + '</span></div>' +
        '<div class="conta-cx"><b data-u="m">--</b><span>' + esc(r.minutos || '') + '</span></div>' +
        '<div class="conta-cx"><b data-u="s">--</b><span>' + esc(r.segundos || '') + '</span></div>' +
      '</div></div>';
  }

  // O prazo nasce na primeira visita e fica guardado no navegador. Recarregar
  // não devolve tempo: contador que se renova a cada F5 qualquer pessoa
  // desmonta em dois segundos.
  function ligarContagem(c){
    var cxs = document.querySelectorAll('.conta');
    if (!cxs.length || !c || !c.minutos) return;
    var ate = 0;
    try {
      ate = parseInt(localStorage.getItem('oferta_ate'), 10) || 0;
      if (!ate) {
        ate = Date.now() + parseInt(c.minutos, 10) * 60000;
        localStorage.setItem('oferta_ate', String(ate));
      }
    } catch (e) { ate = Date.now() + parseInt(c.minutos, 10) * 60000; }

    function pintar(){
      var s = Math.max(0, Math.floor((ate - Date.now()) / 1000));
      var hh = String(Math.floor(s / 3600)).padStart(2, '0');
      var mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      var ss = String(s % 60).padStart(2, '0');
      cxs.forEach(function(n){
        n.querySelector('[data-u="h"]').textContent = hh;
        n.querySelector('[data-u="m"]').textContent = mm;
        n.querySelector('[data-u="s"]').textContent = ss;
        n.classList.toggle('zerado', s === 0);
        if (s === 0 && window.RastreioTSL) window.RastreioTSL.evento('contador_cero');
        if (s === 0 && c.expirado) {
          var t = n.querySelector('.conta-tit');
          if (t) t.textContent = c.expirado;
        }
      });
      return s;
    }
    if (pintar() > 0) {
      var t = setInterval(function(){ if (pintar() === 0) clearInterval(t); }, 1000);
    }
  }

  function botao(b){
    // Sem link de checkout o botão não existe. Botão que não leva a lugar
    // nenhum custa mais caro que botão nenhum.
    if (!b || !b.texto || !CHECKOUT) return '';
    // O riscado embaixo do botão só entra onde o bloco pedir. No herói não
    // entra: ali a pessoa ainda não sabe o que está comprando, e preço antes
    // do valor é só um número.
    var p = T.preco || {}, m = p.moeda ? p.moeda + ' ' : '';
    // `preco_de` no próprio botão vence o total: antes da pilha a pessoa
    // ainda não viu o valor dos bônus, então ali o riscado é só o do livro.
    var de = b.preco_de || p.de;
    var risco = (b.preco && p.por)
      ? '<p class="cta-preco">' +
        (de ? esc(p.txt_de || '') + ' <s>' + esc(m + de) + '</s> ' : '') +
        esc(p.txt_por || '') + ' <b>' + esc(m + p.por) + '</b> ' +
        '<span class="hoy">' + esc(p.txt_hoy || '') + '</span></p>' : '';
    return '<a class="cta" href="' + esc(CHECKOUT) + '" rel="noopener">' +
      esc(b.texto) + '</a>' + risco +
      (b.apoio ? '<p class="cta-apoio">' + esc(b.apoio) + '</p>' : '');
  }

    contador: function(c){ return c && c.minutos ? secao(contagem(c)) : ''; },

    depoimentos: function(c){

    galeria: function(c){ var g = galeriaHtml(c); return g ? secao(g) : ''; },

    transicao: function(c, T){

    atalho: function(c){

      return secao(
        '<h2>' + formato(c.titulo) + '</h2>' +
        (caminhos.length ? '<div class="caminhos">' + caminhos.map(function(caminho){

            (caminho.titulo ? '<h3>' + formato(caminho.titulo) + '</h3>' : '') +

    mockups: function(c){

    previa: function(c){

    // Card medido na página modelo, na ordem dela: faixa com número e título,
    // aspas que respondem a uma objeção, imagem, texto com a transformação em
    // negrito, preço riscado e fecho.
    bonus: function(c){
      var it = c.itens || [];
      if (!it.length) return '';
      // O número de bônus é contado, não escrito: ela ainda vai acrescentar
      // mais um, e título que promete uma quantidade diferente da que está na
      // tela é erro que ninguém revisa depois.
      // `{s}` some quando é um só: contar certo e escrever "1 bonos" seria

      var tit = String(c.titulo || '').replace('%d', it.length)
        .replace(/\{s\}/g, it.length === 1 ? '' : 's');
      return secao(
        '<h2>' + esc(tit).replace(/\*([^*]+)\*/g, '<span class="b-sub">$1</span>') + '</h2>' +
        '<div class="b-lista">' + it.map(function(b, i){
          var n = String(c.rotulo || '').replace('%02d', (i + 1 < 10 ? '0' : '') + (i + 1));
          return '<article class="b-card">' +
            '<div class="b-faixa">' +
              (n ? '<p class="b-num">' + esc(n) + '</p>' : '') +
              '<h3 class="b-tit">' + esc(b.titulo || '') + '</h3>' +
            '</div>' +
            '<div class="b-corpo">' +
              (b.aspas ? '<p class="b-aspas">' + esc(b.aspas) + '</p>' : '') +
              (b.imagem ? '<img class="b-img" src="' + esc(b.imagem) + '" alt="" loading="lazy">' : '') +
              (b.texto ? '<p class="b-desc">' + esc(b.texto)
                  .replace(/\*([^*]+)\*/g, '<b>$1</b>') + '</p>' : '') +
              (b.preco_de ? '<p class="b-preco">' + esc(c.etiqueta_preco || '') +
                  ' <s>' + esc(b.preco_de) + '</s> ' + esc(c.conector || '') +
                  ' <b>' + esc(c.preco_zero || '') + '</b> ' + esc(c.sufixo || '') + '</p>' : '') +
              (c.fecho ? '<p class="b-fecho">' + esc(c.fecho) + '</p>' : '') +
            '</div></article>';
        }).join('') + '</div>', 'escura');
    },

    preco: function(c){
      if (!c.por) return '';
      return secao('<div class="preco">' +
        (c.de ? '<p class="de">' + esc(c.rotulo_de || '') + ' ' + esc(c.de) + '</p>' : '') +
        '<p class="rot">' + esc(c.rotulo_por || '') + '</p>' +
        '<div class="por"><small>' + esc(c.moeda || '') + '</small> ' + esc(c.por) + '</div>' +
        (c.apoio ? '<p class="apoio">' + esc(c.apoio) + '</p>' : '') +
        '</div>', 'roxo');
    },

    // Medida a 1440px na página modelo: selo 190px, título 52px/800 em caixa
    // de 740, texto 20px em caixa de 640. Tudo centralizado, sem moldura.
    garantia: function(c){
      if (!c.texto) return '';
      var email = String(c.email || '').trim();
      var contato = (c.contato_texto ? formato(c.contato_texto) : '') +
        (email ? (c.contato_texto ? ' ' : '') + '<a href="mailto:' +
          esc(email) + '">' + esc(email) + '</a>' : '');
      return secao('<div class="garantia">' +
        (c.selo_img
          ? '<img class="g-selo" src="' + esc(c.selo_img) + '" alt="" width="190" height="190" loading="lazy">'
          : (c.selo ? '<div class="carimbo">' + esc(c.selo).replace(' ', '<br>') + '</div>' : '')) +
        '<h2 class="g-tit">' + formato(c.titulo || '') + '</h2>' +
        paragrafos(c.texto, 'g-txt') +
        (contato ? '<p class="g-contato">' + contato + '</p>' : '') + '</div>', 'escura');
    },

    // O empilhamento de oferta. Cada peça com o seu valor, o total somado, a
    // quebra, o preço e a redução por noite, nessa ordem e num bloco só, que é
    // como a página modelo faz e como a técnica pede: a pilha é a ÚLTIMA coisa
    // antes do preço, senão o preço vira o número que a pessoa compara.
    resumo: function(c, T){
      var it = c.itens || [];
      if (!it.length) return '';
      var p = (T && T.preco) || {};
      var m = p.moeda ? esc(p.moeda) + ' ' : '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2>' +
        (c.texto ? '<p>' + esc(c.texto) + '</p>' : '') +
        '<ul class="pilha">' + it.map(function(t){
          var nome = typeof t === 'string' ? t : (t.nome || '');
          var val  = typeof t === 'string' ? '' : (t.valor || '');
          var img  = typeof t === 'string' ? '' : (t.imagem || '');
          // A capa no lugar do tique quando o item é um livro: a pilha deixa de
          // ser lista e passa a parecer o que a pessoa vai receber.
          return '<li' + (img ? ' class="com-capa"' : '') + '>' +
                 (img ? '<img class="p-capa" src="' + esc(img) + '" alt="" loading="lazy">' : TIQUE) +
                 '<span class="p-nome">' + esc(nome) + '</span>' +
                 (val ? '<span class="p-val">' +
                   (t.gratis ? '<s>' + m + esc(val) + '</s><b class="p-gratis">' + esc(c.gratis || '') + '</b>'
                             : m + esc(val)) + '</span>' : '') + '</li>';
        }).join('') + '</ul>' +
        '<div class="preco">' +
          (p.de ? '<p class="de">' + esc(p.rotulo_de || '') + ' <s>' + m + esc(p.de) + '</s></p>' : '') +
          (p.por ? '<p class="rot">' + esc(p.rotulo_por || '') + '</p>' +
                   '<div class="por"><small>' + esc(p.moeda || '') + '</small> ' + esc(p.por) + '</div>' : '') +
          (p.reducao ? '<p class="reducao">' + esc(p.reducao) + '</p>' : '') +
          (p.apoio ? '<p class="apoio">' + esc(p.apoio) + '</p>' : '') +
        '</div>' + botao(c.botao), 'escura');
    },

    resumo_fim: function(c, T){ return BLOCOS.resumo((T && T.resumo) || {}, T); },

    faq: function(c){
      var it = c.itens || [];
      if (!it.length) return '';
      return secao('<h2>' + esc(c.titulo || '') + '</h2><div class="faq-grid">' +
        it.map(function(q){
          return '<details><summary>' + esc(q.p) + '</summary><p>' + esc(q.r) + '</p></details>';
        }).join('') + '</div>');
    },

    rodape: function(c){
      // Colunas: só entra a que tem conteúdo. Item de link SEM url não vira
      // link, porque link morto no rodapé derruba justamente a seriedade que
      // o rodapé existe para passar.
      function coluna(b, classe, montar){
        var itens = (b && b.itens || []).map(montar).filter(Boolean);
        if (!itens.length) return '';
        return '<div class="r-col"><p class="r-tit">' + esc(b.titulo || '') + '</p>' +
               '<div class="' + classe + '">' + itens.join('') + '</div></div>';
      }
      // Selo com a marca quando existe logo; texto só como reserva.
      var pagos = coluna(c.pagamentos, 'r-pagos', function(t){
        if (t && t.logo) return '<span class="r-pago r-logo" title="' + esc(t.nome || '') + '">' +
          '<img src="' + esc(t.logo) + '" alt="' + esc(t.nome || '') + '" loading="lazy"></span>';
        return '<span class="r-pago">' + esc(typeof t === 'string' ? t : (t.nome || '')) + '</span>';
      });
      var links = coluna(c.links, 'r-links', function(l){
        return l && l.url
          ? '<a class="r-link" href="' + esc(l.url) + '">' + esc(l.texto || '') + '</a>'
          : '';
      });
      var identidade =
        (c.marca ? '<p class="marca">' + esc(c.marca) + '</p>' : '') +
        (c.direitos ? '<p class="r-dir">' + esc(c.direitos) + '</p>' : '') +
        (c.seguro ? '<p class="r-seguro">' + CADEADO + esc(c.seguro) + '</p>' : '') +
        (c.cnpj ? '<p class="r-cnpj">' + esc(c.cnpj) + '</p>' : '');
      return '<section class="rodape"><div class="dentro">' +
        '<div class="r-grade">' +
          (identidade ? '<div class="r-col r-id">' + identidade + '</div>' : '') +
          pagos + links +
        '</div>' +
        (c.legal ? '<p class="r-legal">' + esc(c.legal) + '</p>' : '') +
        (c.aviso ? '<p class="r-aviso">' + esc(c.aviso) + '</p>' : '') + '</div></section>';
    }
  };

  // Abertura falando do caso dela, quando o quiz mandou os dados.
  function saudacao(){
    if (!pessoa.nome && !pessoa.faixa) return '';
    var t = pessoa.nome ? pessoa.nome + ', ' : '';
    if (pessoa.pior) t += 'lo que más te pesa es ' + pessoa.pior + '. ';
    t += 'Esto fue escrito exactamente para eso.';
    return secao('<p style="font-size:18px;color:var(--luz)">' + esc(t) + '</p>');
  }

  function galeriaHtml(c){
      var fs = c.fotos || [];
      // No modo conferência a galeria aparece mesmo vazia, com os lugares
      // marcados, para ela ver onde fica e como anda. O lead nunca vê isso.
      var vazio = !fs.length && PREVIA;
      if (vazio) fs = Array.apply(null, Array(parseInt(c.max, 10) || 6)).map(function(){ return ''; });
      if (!fs.length) return '';
      return ('<div class="gal"><div class="gal-pista" id="gal-pista">' +
        fs.map(function(f){
          var u = typeof f === 'string' ? f : f.url;
          if (!u) return '<figure class="gal-item gal-vazio"><span>espacio para foto real</span></figure>';
          return '<figure class="gal-item"><img src="' + esc(u) + '" alt="" loading="lazy"></figure>';
        }).join('') + '</div><div class="gal-pontos" id="gal-pontos">' +
        fs.map(function(_, i){ return '<i data-i="' + i + '"></i>'; }).join('') +
        '</div></div>');
  }

  // Galeria: avança sozinha, para no primeiro toque, e só anda na tela.
  function montarGaleria(cfg){
    var pista = document.getElementById('gal-pista');
    if (!pista) return;
    var itens = pista.querySelectorAll('.gal-item');
    var pontos = document.querySelectorAll('#gal-pontos i');
    if (itens.length < 2) return;
    function passo(){ return itens[0].getBoundingClientRect().width + 14; }
    function atual(){ return Math.round(pista.scrollLeft / passo()); }
    function pintar(){ var a = atual(); pontos.forEach(function(p, i){ p.classList.toggle('on', i === a); }); }
    function ir(){
      var vis = Math.max(1, Math.round(pista.clientWidth / passo()));
      var alvo = atual() + 1; if (alvo > itens.length - vis) alvo = 0;
      pista.scrollTo({ left: alvo * passo(), behavior: 'smooth' });
    }
    var ms = parseInt(cfg.auto, 10) || 3500, t = null;
    try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0; } catch (e) {}
    function parar(){ if (t) { clearInterval(t); t = null; } }
    function andar(){ if (!t && ms) t = setInterval(function(){ if (!document.hidden) ir(); }, ms); }
    pista.addEventListener('pointerdown', parar);
    pista.addEventListener('scroll', pintar, { passive: true });
    pontos.forEach(function(p, i){ p.onclick = function(){ parar(); pista.scrollTo({ left: i * passo(), behavior: 'smooth' }); }; });
    pintar();
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function(es){ es.forEach(function(e){ e.isIntersecting ? andar() : parar(); }); },
        { threshold: .4 }).observe(pista);
    } else andar();
  }

  // Mesma regra do folheável: anda sozinho, para no primeiro toque e não
  // começa fora da tela.
  function montarCarrossel(cfg){
    var pista = document.getElementById('dep-pista');
    if (!pista) return;
    var cards = pista.querySelectorAll('.dep-card');
    if (!cards.length) return;
    var conta = document.getElementById('dep-conta');

    function passo(){ return cards[0].getBoundingClientRect().width + 18; }
    function atual(){
      return Math.min(cards.length - 1, Math.round(pista.scrollLeft / passo()));
    }
    function visiveis(){
      return Math.max(1, Math.round(pista.clientWidth / passo()));
    }
    function pintar(){
      if (conta) conta.textContent = (atual() + 1) + ' / ' + cards.length;
    }
    function ir(d){
      var alvo = atual() + d;
      if (alvo < 0) alvo = cards.length - 1;
      if (alvo > cards.length - visiveis()) alvo = 0;
      pista.scrollTo({ left: alvo * passo(), behavior: 'smooth' });
    }

    pintar();
    var t = null, ms = parseInt(cfg.auto, 10) || 0;
    function parar(){ if (t) { clearInterval(t); t = null; } }
    function andar(){ if (!t && ms) t = setInterval(function(){
      if (!document.hidden) ir(1);
    }, ms); }

    document.querySelectorAll('.dep-passos .pv').forEach(function(b){
      b.onclick = function(){ parar(); ir(+b.dataset.d); };
    });
    pista.addEventListener('pointerdown', parar);
    pista.addEventListener('scroll', pintar, { passive: true });
    try {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0;
    } catch (e) {}
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function(es){
        es.forEach(function(e){ e.isIntersecting ? andar() : parar(); });
      }, { threshold: .3 }).observe(pista);
    } else { andar(); }
  }

  function montarFolheto(cfg){
    var el = document.getElementById('folheto');
    if (!el || !window.St || !window.St.PageFlip) return;
    var paginas = el.querySelectorAll('.pagina');
    if (!paginas.length) return;
    // A proporção da folha é propriedade do livro, não do código: trocou o
    // miolo, trocou a medida, e isso vem do banco junto com as imagens.
    var larg = parseInt(cfg.largura, 10) || 350;
    var alt  = parseInt(cfg.altura, 10) || 509;
    var largo = window.innerWidth >= 900;
    var f = new window.St.PageFlip(el, {
      width: larg, height: alt, size: 'stretch',
      minWidth: 200, maxWidth: 520, minHeight: 290, maxHeight: Math.round(520 * alt / larg),
      // Capa dura em todos os tamanhos. O bloco escuro que aparecia na
      // virada da capa no celular não era ela: era a cópia temporária da folha
      // caindo fora da pilha, por uma regra minha de CSS já removida.
      usePortrait: !largo, showCover: true, maxShadowOpacity: .18,
      mobileScrollSupport: true, drawShadow: true
    });
    f.loadFromHTML(paginas);

    var conta = document.getElementById('pv-conta');
    function pintar(){
      if (conta) conta.textContent = (f.getCurrentPageIndex() + 1) + ' / ' + f.getPageCount();
    }
    // Uma página por toque, nunca duas. Toque que chega enquanto a folha ainda
    // está virando é ignorado: dois toques rápidos no ›, ou um toque enquanto
    // a revista vira sozinha, faziam pular da página 1 para a 3.
    function virar(d){
      var st = f.getState ? f.getState() : 'read';
      if (st && st !== 'read') return;
      if (d > 0) f.flipNext(); else f.flipPrev();
    }
    f.on('flip', function(){
      pintar();
      if (window.RastreioTSL) window.RastreioTSL.pagina(f.getCurrentPageIndex() + 1);
    });
    pintar();
    document.querySelectorAll('.pv').forEach(function(b){
      b.onclick = function(){
        parar();
        virar(+b.dataset.v);
      };
    });

    // Vira sozinho, mas para no primeiro toque: quem está lendo uma página não
    // pode ter a página arrancada da mão. E não começa fora da tela, senão o
    // lead chega na prévia com ela já no fim.
    var t = null, ms = parseInt(cfg.auto, 10) || 0;
    function parar(){ if (t) { clearInterval(t); t = null; } }
    function andar(){
      if (t || !ms) return;
      t = setInterval(function(){
        if (document.hidden) return;
        if (f.getCurrentPageIndex() >= f.getPageCount() - 1) return parar();
        virar(1);
      }, ms);
    }
    try {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0;
    } catch (e) {}
    el.addEventListener('pointerdown', parar);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function(es){
        es.forEach(function(e){ e.isIntersecting ? andar() : parar(); });
      }, { threshold: .4 }).observe(el);
    } else { andar(); }
  }

  fetch(CFG.url + '/rest/v1/quiz_templates?select=id,schema&slug=eq.' + CFG.slug + '&active=eq.true', {
    headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon }
  }).then(function(r){ return r.json(); }).then(function(linhas){
    if (!linhas || !linhas.length) throw new Error('página no encontrada');
    ESQ = linhas[0].schema || {};
    var QUIZ_ID = linhas[0].id;
    T = ESQ.tsl_es || {};
    CHECKOUT = T.checkout || '';
    // Na conferência os botões aparecem mesmo sem checkout: é essa copy que
    // mais precisa ser lida antes de existir para onde mandar.
    if (PREVIA && !CHECKOUT) CHECKOUT = '#';
    // O texto da tarja mora no banco: escrito aqui ele envelhece sozinho, e
    // foi o que aconteceu com a bio, que continuou listada como pendente
    // depois de pronta. Vazio no banco = tarja não aparece.
    if (PREVIA && T.aviso_previa) {
      var av = document.getElementById('previa');
      av.textContent = T.aviso_previa;
      av.classList.remove('oculto');
    }
    var html = '';
    (T.ordem || []).forEach(function(nome, i){
      if (i === 1) html += saudacao();
      // O segundo argumento existe para os blocos que precisam olhar fora da
      // própria chave: a prova repetida do fim e o atalho, que mostra o preço.
      // Cada seção leva o nome do bloco: é o que o rastreio usa para dizer
      // em que ponto da página a pessoa parou.
      if (BLOCOS[nome]) html += String(BLOCOS[nome](T[nome] || {}, T))
        .replace('<section ', '<section data-bloco="' + nome + '" ');
    });
    document.getElementById('pagina').innerHTML = html;
    montarFolheto(T.previa || {});
    montarCarrossel(T.depoimentos || {});
    montarGaleria(T.galeria || {});
    ligarContagem(T.contador || {});
    montarLetreiro(T.cabecalho);
    montarBarra(T.barra);
    if (window.RastreioTSL && !PREVIA) window.RastreioTSL.iniciar({
      url: CFG.url, anon: CFG.anon, quizId: QUIZ_ID,
      rastreio: ESQ.rastreio || {}, resultado: lerResultado() });
  }).catch(function(e){
    document.getElementById('pagina').innerHTML =
      '<section class="faixa"><div class="dentro"><h2>No pude cargar la página</h2>' +
      '<p>Recarga en unos instantes.</p></div></section>';
  });
})();
</script>
